<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Hotel CMS | Sign in</title><style>:root{--navy:#17242b;--gold:#b98854;--paper:#f1f4f1;--line:#e5e9e8;--muted:#718087}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,rgba(185,136,84,.18),transparent 26rem),var(--paper);color:var(--navy);font-family:"Trebuchet MS",Arial,sans-serif}.card{width:min(410px,calc(100% - 40px));background:rgba(255,255,255,.96);padding:44px;border:1px solid var(--line);border-radius:14px;box-shadow:0 24px 60px rgba(23,36,43,.12)}.brand{color:var(--gold);letter-spacing:.18em;font-size:11px;font-weight:bold}.card h1{font-family:Georgia,serif;font-size:30px;font-weight:500;margin:16px 0 7px}.card p{color:var(--muted);font-size:13px;line-height:1.6;margin:0 0 28px}label{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-size:10px;margin:18px 0 7px}input{width:100%;border:1px solid var(--line);border-radius:6px;padding:13px;font:inherit;background:#fff}input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(185,136,84,.18)}.button{width:100%;margin-top:26px;border:0;border-radius:6px;background:var(--navy);color:#fff;padding:14px;font-weight:bold;cursor:pointer}.button:hover{background:#2b454a;transform:translateY(-1px)}.error{padding:10px;background:#f7e8e8;color:#a24f4f;font-size:12px;border-radius:5px}</style></head><body><form class="card" method="post">{% csrf_token %}<span class="brand">HOTEL</span><h1>Operations CMS</h1><p>Sign in to manage rooms and reservations.</p>{% for message in messages %}<div class="error">{{ message }}</div>{% endfor %}<label for="username">Username</label><input id="username" name="username" autocomplete="username" required><label for="password">Password</label><input id="password" type="password" name="password" autocomplete="current-password" required><button class="button" type="submit">Sign in</button></form></body></html>
