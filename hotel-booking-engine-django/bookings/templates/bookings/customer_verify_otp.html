<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Verify mobile | Hotel</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f3ee;color:#321b1c;font-family:Arial,sans-serif}.card{width:min(390px,calc(100% - 32px));background:#fff;padding:42px;border:1px solid #e8e2d8;text-align:center;box-shadow:0 20px 50px rgba(50,27,28,.1)}.brand{color:#a8864d;letter-spacing:.16em;font-size:11px;font-weight:bold}.card h1{font:400 32px Georgia,serif;margin:16px 0 8px}.card p{color:#756b66;font-size:13px;line-height:1.6}.input{width:100%;box-sizing:border-box;border:1px solid #e8e2d8;padding:14px;text-align:center;font-size:24px;letter-spacing:.35em}.button{width:100%;margin-top:22px;border:0;background:#321b1c;color:#fff;padding:14px;font-weight:bold;cursor:pointer}.error{padding:11px;background:#f7e8e8;color:#a24f4f;font-size:12px;margin:15px 0}.dev{margin-top:18px;padding:10px;background:#fff8e8;color:#8e693d;font-size:12px}.back{display:block;margin-top:20px;color:#8e693d;font-size:13px}</style></head><body><form class="card" method="post">{% csrf_token %}<span class="brand">SECURE VERIFICATION</span><h1>Verify your mobile</h1><p>Enter the six-digit code sent to {{ identifier }}.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<input class="input" name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required><button class="button" type="submit">Verify and continue</button>{% if show_dev_code %}<div class="dev">Local development OTP: <strong>{{ dev_code }}</strong></div>{% endif %}<a class="back" href="{% url 'customer-login' %}">Start again</a></form></body></html>
